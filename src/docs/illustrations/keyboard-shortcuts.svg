<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <!-- Light theme -->
  <rect width="600" height="420" fill="#e8edf3"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">Keyboard Shortcuts</text>

  <!-- Helper macro: each card is rect+key+label -->
  <!-- Row 1: File -->
  <g transform="translate(20,50)">
    <rect width="170" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1f2937" text-anchor="middle">Ctrl+N</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">New doc</text>
  </g>
  <g transform="translate(200,50)">
    <rect width="170" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1f2937" text-anchor="middle">Ctrl+O</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Open file</text>
  </g>
  <g transform="translate(380,50)">
    <rect width="200" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1f2937" text-anchor="middle">Ctrl+S</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Save</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(20,105)">
    <rect width="170" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="75" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="45" y="28" font-family="monospace" font-size="10" fill="#1f2937" text-anchor="middle">Ctrl+Shift+S</text>
    <text x="95" y="28" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Save as</text>
  </g>
  <g transform="translate(200,105)">
    <rect width="170" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1f2937" text-anchor="middle">Ctrl+W</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Close tab</text>
  </g>
  <g transform="translate(380,105)">
    <rect width="200" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1f2937" text-anchor="middle">Ctrl+Q</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Quit</text>
  </g>

  <!-- Row 3: Edit -->
  <g transform="translate(20,160)">
    <rect width="170" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1f2937" text-anchor="middle">Ctrl+Z</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Undo</text>
  </g>
  <g transform="translate(200,160)">
    <rect width="170" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1f2937" text-anchor="middle">Ctrl+Y</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Redo</text>
  </g>
  <g transform="translate(380,160)">
    <rect width="200" height="45" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="8" y="10" width="40" height="25" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="28" y="28" font-family="monospace" font-size="11" fill="#1f2937" text-anchor="middle">F5</text>
    <text x="60" y="28" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Refresh preview</text>
  </g>

  <!-- Row 4: View panel toggles (blue accent) -->
  <g transform="translate(20,215)">
    <rect width="170" height="45" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1e3a8a" text-anchor="middle">Ctrl+E</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">Explorer</text>
  </g>
  <g transform="translate(200,215)">
    <rect width="170" height="45" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1e3a8a" text-anchor="middle">Ctrl+T</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">Tags</text>
  </g>
  <g transform="translate(380,215)">
    <rect width="200" height="45" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#1e3a8a" text-anchor="middle">Ctrl+L</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">Network</text>
  </g>

  <!-- Row 5: LLM Chat shortcuts (purple accent - new) -->
  <g transform="translate(20,270)">
    <rect width="170" height="45" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <rect x="8" y="10" width="56" height="25" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
    <text x="36" y="28" font-family="monospace" font-size="11" fill="#4c1d95" text-anchor="middle">Ctrl+M</text>
    <text x="76" y="28" font-family="Arial, sans-serif" font-size="10" fill="#7c3aed">LLM Chat</text>
    <rect x="131" y="6" width="30" height="13" rx="3" fill="#7c3aed"/>
    <text x="146" y="16" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">NEW</text>
  </g>
  <g transform="translate(200,270)">
    <rect width="380" height="45" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <rect x="8" y="10" width="82" height="25" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
    <text x="49" y="28" font-family="monospace" font-size="10" fill="#4c1d95" text-anchor="middle">Ctrl+Enter</text>
    <text x="102" y="28" font-family="Arial, sans-serif" font-size="10" fill="#7c3aed">Send LLM prompt</text>
    <rect x="284" y="6" width="30" height="13" rx="3" fill="#7c3aed"/>
    <text x="299" y="16" font-family="Arial, sans-serif" font-size="7" fill="#fff" text-anchor="middle">NEW</text>
  </g>

  <!-- Tip -->
  <rect x="20" y="330" width="560" height="76" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="36" y="352" font-family="Arial, sans-serif" font-size="11" fill="#0369a1" font-weight="bold">💡 Tip:</text>
  <text x="80" y="352" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">Hover over menu items to see their keyboard shortcut.</text>
  <text x="36" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">On macOS use ⌘ instead of Ctrl.  Blue cards = View panel toggles.  Purple cards = LLM Chat.</text>
  <text x="36" y="393" font-family="Arial, sans-serif" font-size="10" fill="#7c3aed">LLM Chat must be enabled in Options › LLM tab before Ctrl+M is shown in the View menu.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f5f5f5"/>

  <!-- === LEFT SIDE: Docked Panel === -->
  
  <!-- Panel container -->
  <rect x="20" y="60" width="180" height="280" rx="4" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Panel header -->
  <rect x="20" y="60" width="180" height="28" rx="4" fill="#404040"/>
  <rect x="20" y="80" width="180" height="8" fill="#404040"/>
  
  <!-- Panel title -->
  <text x="35" y="79" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">Tag Cloud</text>
  
  <!-- Close button -->
  <rect x="165" y="66" width="16" height="16" rx="2" fill="#555555"/>
  <text x="170" y="78" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">×</text>
  
  <!-- Detach button (highlighted) -->
  <rect x="145" y="66" width="16" height="16" rx="2" fill="#0078d7" stroke="#005a9e" stroke-width="1"/>
  <text x="149" y="78" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">⇱</text>
  
  <!-- Highlight circle around detach button -->
  <circle cx="153" cy="74" r="14" fill="none" stroke="#ff6b35" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Panel content (tag cloud representation) -->
  <text x="40" y="120" font-family="Arial, sans-serif" font-size="14" fill="#4ecdc4">java</text>
  <text x="85" y="115" font-family="Arial, sans-serif" font-size="10" fill="#95a5a6">docs</text>
  <text x="35" y="145" font-family="Arial, sans-serif" font-size="16" fill="#ff6b6b">tutorial</text>
  <text x="120" y="140" font-family="Arial, sans-serif" font-size="11" fill="#a29bfe">api</text>
  <text x="50" y="170" font-family="Arial, sans-serif" font-size="12" fill="#55a3ff">guide</text>
  <text x="110" y="168" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">config</text>
  <text x="45" y="195" font-family="Arial, sans-serif" font-size="13" fill="#fdcb6e">markdown</text>
  
  <!-- Label "Docked Panel" -->
  <text x="110" y="360" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" font-weight="bold">Docked Panel</text>
  
  <!-- Callout for detach button -->
  <line x1="153" y1="88" x2="153" y2="110" stroke="#ff6b35" stroke-width="2"/>
  <rect x="95" y="110" width="116" height="20" rx="3" fill="#ff6b35"/>
  <text x="153" y="124" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Detach Button ⇱</text>

  <!-- === ARROW === -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0078d7"/>
    </marker>
  </defs>
  
  <!-- Arrow -->
  <line x1="220" y1="200" x2="320" y2="200" stroke="#0078d7" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="270" y="185" font-family="Arial, sans-serif" font-size="11" fill="#0078d7" text-anchor="middle">Click</text>

  <!-- === RIGHT SIDE: Detached as Tab === -->
  
  <!-- Editor area container -->
  <rect x="340" y="40" width="440" height="320" rx="4" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Tab bar -->
  <rect x="340" y="40" width="440" height="30" fill="#3d3d3d"/>
  
  <!-- Document tab -->
  <rect x="345" y="45" width="100" height="22" rx="3" fill="#4a4a4a"/>
  <text x="355" y="60" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">document.md</text>
  <text x="435" y="60" font-family="Arial, sans-serif" font-size="10" fill="#888888">×</text>
  
  <!-- Detached panel tab (highlighted) -->
  <rect x="450" y="45" width="95" height="22" rx="3" fill="#0078d7" stroke="#005a9e" stroke-width="1"/>
  <text x="460" y="60" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Tag Cloud</text>
  <text x="530" y="60" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">×</text>
  
  <!-- Highlight for new tab -->
  <rect x="447" y="42" width="101" height="28" rx="4" fill="none" stroke="#ff6b35" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Tab content area showing tag cloud -->
  <rect x="340" y="70" width="440" height="290" fill="#1e1e1e"/>
  
  <!-- Tag cloud in tab -->
  <text x="420" y="120" font-family="Arial, sans-serif" font-size="18" fill="#4ecdc4">java</text>
  <text x="520" y="115" font-family="Arial, sans-serif" font-size="12" fill="#95a5a6">docs</text>
  <text x="380" y="160" font-family="Arial, sans-serif" font-size="22" fill="#ff6b6b">tutorial</text>
  <text x="550" y="150" font-family="Arial, sans-serif" font-size="14" fill="#a29bfe">api</text>
  <text x="450" y="200" font-family="Arial, sans-serif" font-size="16" fill="#55a3ff">guide</text>
  <text x="580" y="190" font-family="Arial, sans-serif" font-size="11" fill="#95a5a6">config</text>
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="17" fill="#fdcb6e">markdown</text>
  <text x="540" y="235" font-family="Arial, sans-serif" font-size="13" fill="#74b9ff">project</text>
  <text x="620" y="230" font-family="Arial, sans-serif" font-size="10" fill="#a29bfe">index</text>
  <text x="360" y="280" font-family="Arial, sans-serif" font-size="20" fill="#fd79a8">features</text>
  <text x="520" y="275" font-family="Arial, sans-serif" font-size="15" fill="#4ecdc4">help</text>
  
  <!-- Restore button in tab header -->
  <rect x="650" y="80" width="120" height="50" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="660" y="98" font-family="Arial, sans-serif" font-size="9" fill="#856404">Use ⇲ button or</text>
  <text x="660" y="112" font-family="Arial, sans-serif" font-size="9" fill="#856404">View menu to</text>
  <text x="660" y="126" font-family="Arial, sans-serif" font-size="9" fill="#856404" font-weight="bold">restore panel</text>
  
  <!-- Label "Detached as Tab" -->
  <text x="560" y="380" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" font-weight="bold">Detached as Tab</text>
  
  <!-- Callout for new tab -->
  <line x1="497" y1="42" x2="497" y2="20" stroke="#ff6b35" stroke-width="2"/>
  <rect x="430" y="5" width="135" height="18" rx="3" fill="#ff6b35"/>
  <text x="497" y="17" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Panel becomes a Tab</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <!-- Light theme -->
  <rect width="500" height="280" fill="#e8edf3"/>

  <!-- Title -->
  <text x="250" y="28" font-family="Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Front Matter — Links &amp; Tags</text>

  <!-- YAML code block -->
  <rect x="20" y="45" width="223" height="215" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="68" font-family="monospace" font-size="12" fill="#9ca3af">---</text>
  <text x="30" y="88" font-family="monospace" font-size="12" fill="#ef4444">title:</text>
  <text x="82" y="88" font-family="monospace" font-size="12" fill="#16a34a">Getting Started</text>
  <text x="30" y="108" font-family="monospace" font-size="12" fill="#ef4444">tags:</text>
  <text x="82" y="108" font-family="monospace" font-size="12" fill="#16a34a">java, tutorial</text>
  <text x="30" y="128" font-family="monospace" font-size="12" fill="#ef4444">authors:</text>
  <text x="98" y="128" font-family="monospace" font-size="12" fill="#16a34a">John Doe</text>
  <text x="30" y="148" font-family="monospace" font-size="12" fill="#ef4444">summary:</text>
  <text x="102" y="148" font-family="monospace" font-size="12" fill="#16a34a">A quick intro</text>
  <text x="30" y="168" font-family="monospace" font-size="12" fill="#ef4444">links:</text>
  <text x="30" y="188" font-family="monospace" font-size="12" fill="#7c3aed">  -</text>
  <text x="56" y="188" font-family="monospace" font-size="10" fill="#16a34a">550e8400-e29b-41d4...</text>
  <text x="30" y="208" font-family="monospace" font-size="12" fill="#7c3aed">  -</text>
  <text x="56" y="208" font-family="monospace" font-size="10" fill="#16a34a">7c9e6679-7425-40de...</text>
  <text x="30" y="228" font-family="monospace" font-size="12" fill="#ef4444">draft:</text>
  <text x="82" y="228" font-family="monospace" font-size="12" fill="#f59e0b">false</text>
  <text x="30" y="248" font-family="monospace" font-size="12" fill="#9ca3af">---</text>

  <!-- Arrows from links to graph -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>
  <line x1="245" y1="190" x2="278" y2="170" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
  <line x1="245" y1="108" x2="278" y2="120" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <!-- Mini graph -->
  <rect x="272" y="58" width="210" height="202" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>

  <!-- intro.md node -->
  <circle cx="322" cy="122" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="322" y="118" font-family="Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">📄</text>
  <text x="322" y="130" font-family="Arial, sans-serif" font-size="6" fill="#374151" text-anchor="middle">intro.md</text>

  <!-- guide.md node -->
  <circle cx="422" cy="112" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="422" y="108" font-family="Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">📄</text>
  <text x="422" y="120" font-family="Arial, sans-serif" font-size="6" fill="#374151" text-anchor="middle">guide.md</text>

  <!-- api.md node -->
  <circle cx="372" cy="202" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="372" y="198" font-family="Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">📄</text>
  <text x="372" y="210" font-family="Arial, sans-serif" font-size="6" fill="#374151" text-anchor="middle">api.md</text>

  <!-- Tag: #java -->
  <circle cx="367" cy="142" r="9" fill="#2563eb"/>
  <text x="367" y="139" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="bold">#</text>
  <text x="367" y="148" font-family="Arial, sans-serif" font-size="6" fill="#ffffff" text-anchor="middle">java</text>

  <!-- Tag: #tutorial -->
  <circle cx="312" cy="172" r="9" fill="#7c3aed"/>
  <text x="312" y="169" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="bold">#</text>
  <text x="312" y="178" font-family="Arial, sans-serif" font-size="5" fill="#ffffff" text-anchor="middle">tutorial</text>

  <!-- Solid edges (links) -->
  <line x1="322" y1="122" x2="422" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="322" y1="122" x2="372" y2="202" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Dashed edges (tags) -->
  <line x1="322" y1="122" x2="367" y2="142" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="422" y1="112" x2="367" y2="142" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="322" y1="122" x2="312" y2="172" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="372" y1="202" x2="312" y2="172" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Legend at bottom -->
  <text x="300" y="80" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Network Diagram</text>
</svg>

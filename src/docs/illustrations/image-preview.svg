<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="500" height="330">
  <!-- Background -->
  <rect width="500" height="330" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="250" y="24" font-family="Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Image Preview</text>

  <!-- Tab frame -->
  <rect x="20" y="40" width="460" height="275" rx="6" fill="#1e1e1e" stroke="#3d3d3d" stroke-width="1"/>

  <!-- Tab bar -->
  <rect x="20" y="40" width="460" height="26" rx="6" fill="#2d2d2d"/>
  <rect x="20" y="56" width="460" height="10" fill="#2d2d2d"/>
  <rect x="20" y="40" width="120" height="26" rx="6" fill="#1e1e1e"/>
  <rect x="20" y="56" width="120" height="10" fill="#1e1e1e"/>
  <text x="35" y="58" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">screenshot.png</text>
  <text x="125" y="58" font-family="Arial, sans-serif" font-size="11" fill="#888888">×</text>

  <!-- Info banner -->
  <rect x="20" y="66" width="460" height="24" fill="#333333"/>
  <text x="250" y="82" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">PNG  |  800 × 600 px</text>

  <!-- Image area (checkerboard pattern for transparency indication) -->
  <rect x="20" y="90" width="460" height="225" fill="#252525"/>

  <!-- Simulated image content -->
  <rect x="100" y="110" width="300" height="180" rx="4" fill="#3a3a3a" stroke="#555555" stroke-width="1"/>

  <!-- Simulated image elements -->
  <rect x="120" y="125" width="120" height="20" rx="3" fill="#4a90d9" opacity="0.7"/>
  <text x="180" y="140" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Header</text>

  <rect x="120" y="155" width="260" height="60" rx="3" fill="#2a2a2a"/>
  <text x="150" y="175" font-family="monospace" font-size="10" fill="#98c379">public class Main {</text>
  <text x="160" y="192" font-family="monospace" font-size="10" fill="#abb2bf">  // content...</text>
  <text x="150" y="209" font-family="monospace" font-size="10" fill="#98c379">}</text>

  <rect x="120" y="225" width="260" height="50" rx="3" fill="#383838"/>
  <text x="150" y="248" font-family="Arial, sans-serif" font-size="10" fill="#888888">Sample image content</text>
  <text x="150" y="265" font-family="Arial, sans-serif" font-size="10" fill="#888888">with code and UI elements</text>

  <!-- Zoom level overlay (centered, semi-transparent) -->
  <rect x="205" y="178" width="90" height="34" rx="8" fill="#000000" opacity="0.65"/>
  <text x="250" y="201" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">150%</text>

  <!-- Labels -->
  <rect x="340" y="70" width="105" height="16" rx="4" fill="#4a90d9" opacity="0.9"/>
  <text x="393" y="82" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Format &amp; Size Info</text>

  <rect x="305" y="185" width="95" height="16" rx="4" fill="#4a90d9" opacity="0.9"/>
  <text x="353" y="197" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Zoom Overlay</text>
</svg>

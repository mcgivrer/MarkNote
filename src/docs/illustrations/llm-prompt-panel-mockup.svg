<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 600" width="350" height="600">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="userMsgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="assistantMsgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Panel Background -->
  <rect x="0" y="0" width="350" height="600" fill="#1a202c" rx="8"/>
  
  <!-- ========== ZONE HISTORIQUE (2/3) ========== -->
  
  <!-- History Header -->
  <rect x="0" y="0" width="350" height="36" fill="url(#headerGrad)" rx="8"/>
  <rect x="0" y="28" width="350" height="8" fill="url(#headerGrad)"/>
  <text x="12" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Historique de Session</text>
  
  <!-- History Toolbar -->
  <g transform="translate(280, 8)">
    <!-- Export All Button -->
    <rect x="0" y="0" width="24" height="20" rx="3" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <text x="12" y="14" font-family="Arial" font-size="10" fill="#e2e8f0" text-anchor="middle">⬇</text>
    <!-- Clear Button -->
    <rect x="28" y="0" width="24" height="20" rx="3" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <text x="40" y="14" font-family="Arial" font-size="10" fill="#e2e8f0" text-anchor="middle">🗑</text>
  </g>
  
  <!-- Conversation Area -->
  <rect x="8" y="44" width="334" height="346" fill="#2d3748" rx="4"/>
  
  <!-- User Message 1 -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="270" height="50" rx="8" fill="url(#userMsgGrad)" filter="url(#shadow)"/>
    <text x="12" y="18" font-family="Arial" font-size="10" fill="#bee3f8" font-weight="bold">Vous</text>
    <text x="12" y="34" font-family="Arial" font-size="11" fill="#ffffff">Comment créer un tableau en</text>
    <text x="12" y="46" font-family="Arial" font-size="11" fill="#ffffff">Markdown ?</text>
    <!-- Edit button -->
    <rect x="240" y="4" width="20" height="16" rx="2" fill="rgba(255,255,255,0.2)"/>
    <text x="250" y="15" font-family="Arial" font-size="9" fill="#fff" text-anchor="middle">✎</text>
  </g>
  
  <!-- Assistant Message 1 -->
  <g transform="translate(12, 116)">
    <rect x="0" y="0" width="290" height="100" rx="8" fill="url(#assistantMsgGrad)" filter="url(#shadow)"/>
    <text x="12" y="18" font-family="Arial" font-size="10" fill="#c6f6d5" font-weight="bold">Assistant</text>
    <text x="12" y="36" font-family="Arial" font-size="11" fill="#ffffff">Voici la syntaxe pour un tableau :</text>
    <rect x="12" y="44" width="266" height="44" rx="4" fill="rgba(0,0,0,0.3)"/>
    <text x="20" y="58" font-family="monospace" font-size="9" fill="#e2e8f0">| Col1 | Col2 |</text>
    <text x="20" y="70" font-family="monospace" font-size="9" fill="#e2e8f0">|------|------|</text>
    <text x="20" y="82" font-family="monospace" font-size="9" fill="#e2e8f0">| A    | B    |</text>
    <!-- Action buttons -->
    <g transform="translate(220, 4)">
      <rect x="0" y="0" width="20" height="16" rx="2" fill="rgba(255,255,255,0.2)"/>
      <text x="10" y="11" font-family="Arial" font-size="9" fill="#fff" text-anchor="middle">⬇</text>
      <rect x="24" y="0" width="20" height="16" rx="2" fill="rgba(255,255,255,0.2)"/>
      <text x="34" y="11" font-family="Arial" font-size="9" fill="#fff" text-anchor="middle">📋</text>
    </g>
  </g>
  
  <!-- User Message 2 -->
  <g transform="translate(60, 226)">
    <rect x="0" y="0" width="270" height="36" rx="8" fill="url(#userMsgGrad)" filter="url(#shadow)"/>
    <text x="12" y="16" font-family="Arial" font-size="10" fill="#bee3f8" font-weight="bold">Vous</text>
    <text x="12" y="30" font-family="Arial" font-size="11" fill="#ffffff">Et comment aligner le texte ?</text>
    <rect x="240" y="4" width="20" height="16" rx="2" fill="rgba(255,255,255,0.2)"/>
    <text x="250" y="15" font-family="Arial" font-size="9" fill="#fff" text-anchor="middle">✎</text>
  </g>
  
  <!-- Assistant Message 2 (typing indicator) -->
  <g transform="translate(12, 272)">
    <rect x="0" y="0" width="120" height="36" rx="8" fill="url(#assistantMsgGrad)" filter="url(#shadow)"/>
    <text x="12" y="16" font-family="Arial" font-size="10" fill="#c6f6d5" font-weight="bold">Assistant</text>
    <!-- Typing dots -->
    <circle cx="24" cy="28" r="4" fill="#fff" opacity="0.6"/>
    <circle cx="38" cy="28" r="4" fill="#fff" opacity="0.8"/>
    <circle cx="52" cy="28" r="4" fill="#fff" opacity="1"/>
  </g>
  
  <!-- Scrollbar -->
  <rect x="340" y="50" width="4" height="334" rx="2" fill="#4a5568"/>
  <rect x="340" y="50" width="4" height="120" rx="2" fill="#718096"/>
  
  <!-- ========== SEPARATOR ========== -->
  <rect x="0" y="394" width="350" height="2" fill="#4a5568"/>
  
  <!-- ========== ZONE PROMPT (1/3) ========== -->
  
  <!-- Prompt Header -->
  <rect x="0" y="396" width="350" height="32" fill="url(#headerGrad)"/>
  <text x="12" y="418" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Prompt</text>
  
  <!-- Prompt Toolbar -->
  <g transform="translate(280, 404)">
    <!-- Context Button -->
    <rect x="0" y="0" width="52" height="20" rx="3" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <text x="26" y="14" font-family="Arial" font-size="9" fill="#e2e8f0" text-anchor="middle">⚙ Contexte</text>
  </g>
  
  <!-- Text Input Area -->
  <rect x="8" y="436" width="334" height="110" fill="#2d3748" rx="4" stroke="#4a5568" stroke-width="1"/>
  <text x="16" y="456" font-family="Arial" font-size="12" fill="#a0aec0">Entrez votre prompt ici...</text>
  <text x="16" y="474" font-family="Arial" font-size="12" fill="#a0aec0">Utilisez Ctrl+Entrée pour envoyer</text>
  
  <!-- Cursor blink line -->
  <rect x="16" y="442" width="2" height="16" fill="#63b3ed"/>
  
  <!-- Submit Button -->
  <g transform="translate(8, 554)">
    <rect x="0" y="0" width="334" height="36" rx="6" fill="#3182ce" filter="url(#shadow)"/>
    <text x="167" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Envoyer</text>
    <!-- Or show Cancel when processing -->
  </g>
  
  <!-- Dimension annotations -->
  <g fill="none" stroke="#718096" stroke-width="1" stroke-dasharray="4,2">
    <!-- 2/3 indicator -->
    <line x1="355" y1="0" x2="355" y2="394"/>
    <text x="360" y="200" font-family="Arial" font-size="10" fill="#718096" transform="rotate(90, 360, 200)">2/3 hauteur</text>
    
    <!-- 1/3 indicator -->
    <line x1="355" y1="396" x2="355" y2="600"/>
    <text x="360" y="500" font-family="Arial" font-size="10" fill="#718096" transform="rotate(90, 360, 500)">1/3 hauteur</text>
  </g>
</svg>

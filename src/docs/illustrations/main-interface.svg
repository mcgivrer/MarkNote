  <text x="193" y="281" font-family="monospace" font-size="11" fill="#7c3aed">## Features</text>
  <text x="193" y="300" font-family="monospace" font-size="11" fill="#374151">- Live preview</text>
  <text x="193" y="318" font-family="monospace" font-size="11" fill="#374151">- Syntax highlighting</text>
  <text x="193" y="336" font-family="monospace" font-size="11" fill="#374151">- LLM Chat integration</text>
  <text x="193" y="360" font-family="monospace" font-size="11" fill="#7c3aed">## Usage</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 260" width="550" height="260">
  <!-- Background -->
  <rect width="550" height="260" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="275" y="24" font-family="Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Drag &amp; Drop into Editor</text>

  <!-- Project Explorer Panel -->
  <rect x="20" y="45" width="170" height="195" rx="6" fill="#2a2a2a" stroke="#3d3d3d" stroke-width="1"/>
  <rect x="20" y="45" width="170" height="25" rx="6" fill="#383838"/>
  <rect x="20" y="60" width="170" height="10" fill="#383838"/>
  <text x="30" y="63" font-family="Arial, sans-serif" font-size="10" fill="#cccccc">Project Explorer</text>

  <!-- File tree -->
  <text x="30" y="90" font-family="monospace" font-size="10" fill="#e5c07b">📁 my-project</text>
  <text x="45" y="110" font-family="monospace" font-size="10" fill="#61afef">📄 README.md</text>
  <text x="45" y="130" font-family="monospace" font-size="10" fill="#e5c07b">📁 docs</text>
  <text x="60" y="150" font-family="monospace" font-size="10" fill="#61afef">📄 guide.md</text>
  <text x="45" y="170" font-family="monospace" font-size="10" fill="#e5c07b">📁 images</text>
  <!-- Highlighted file being dragged -->
  <rect x="56" y="176" width="120" height="16" rx="2" fill="#4a90d9" opacity="0.3"/>
  <text x="60" y="190" font-family="monospace" font-size="10" fill="#61afef" font-weight="bold">📄 screenshot.png</text>

  <!-- Drag arrow -->
  <defs>
    <marker id="arrowDrag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/>
    </marker>
  </defs>
  <path d="M 180 188 C 220 188, 260 160, 310 155" stroke="#4a90d9" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowDrag)"/>
  <text x="240" y="150" font-family="Arial, sans-serif" font-size="10" fill="#4a90d9" font-style="italic">drag</text>

  <!-- Editor area -->
  <rect x="280" y="45" width="250" height="195" rx="6" fill="#1e1e1e" stroke="#3d3d3d" stroke-width="1"/>

  <!-- Tab bar -->
  <rect x="280" y="45" width="250" height="25" rx="6" fill="#2d2d2d"/>
  <rect x="280" y="60" width="250" height="10" fill="#2d2d2d"/>
  <rect x="280" y="45" width="100" height="25" rx="6" fill="#1e1e1e"/>
  <rect x="280" y="60" width="100" height="10" fill="#1e1e1e"/>
  <text x="293" y="63" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">README.md</text>

  <!-- Markdown content -->
  <text x="295" y="95" font-family="monospace" font-size="11" fill="#c678dd"># My Project</text>
  <text x="295" y="115" font-family="monospace" font-size="11" fill="#abb2bf">Welcome to the project.</text>
  <text x="295" y="135" font-family="monospace" font-size="11" fill="#abb2bf"></text>

  <!-- Drop cursor indicator -->
  <line x1="295" y1="147" x2="295" y2="163" stroke="#4a90d9" stroke-width="2"/>

  <!-- Inserted markdown link (highlighted) -->
  <rect x="290" y="147" width="230" height="18" rx="2" fill="#4a90d9" opacity="0.15"/>
  <text x="295" y="161" font-family="monospace" font-size="11" fill="#98c379">![screenshot](images/screenshot.png)</text>

  <!-- More content -->
  <text x="295" y="181" font-family="monospace" font-size="11" fill="#abb2bf">Check the docs for more.</text>

  <!-- Legend -->
  <rect x="290" y="210" width="220" height="22" rx="4" fill="#2d2d2d"/>
  <text x="300" y="225" font-family="monospace" font-size="9" fill="#888888">Image → ![name](path)</text>
  <text x="450" y="225" font-family="monospace" font-size="9" fill="#888888">.md → [title](path)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="220" rx="12" fill="#f8f9fb"/>

  <!-- Title -->
  <text x="430" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Pipeline d'un LLM — Flux de traitement</text>

  <!-- Step 1: Texte d'entrée -->
  <rect x="20" y="60" width="120" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Texte</text>
  <text x="80" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">d'entrée</text>
  <text x="80" y="142" text-anchor="middle" font-size="10" fill="#6b7280">« Que signifie</text>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="#6b7280">le RAG ? »</text>

  <!-- Arrow 1 -->
  <line x1="140" y1="90" x2="168" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Tokenisation -->
  <rect x="170" y="60" width="120" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">Tokeni-</text>
  <text x="230" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">sation</text>
  <text x="230" y="142" text-anchor="middle" font-size="10" fill="#6b7280">[42, 198, 74,</text>
  <text x="230" y="155" text-anchor="middle" font-size="10" fill="#6b7280">391, 27 …]</text>

  <!-- Arrow 2 -->
  <line x1="290" y1="90" x2="318" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Embeddings -->
  <rect x="320" y="60" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Projec-</text>
  <text x="380" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">tion</text>
  <text x="380" y="142" text-anchor="middle" font-size="10" fill="#6b7280">Vecteurs</text>
  <text x="380" y="155" text-anchor="middle" font-size="10" fill="#6b7280">d'entrée</text>

  <!-- Arrow 3 -->
  <line x1="440" y1="90" x2="468" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Couches Transformer -->
  <rect x="470" y="48" width="140" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Couches</text>
  <text x="540" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Transformer</text>
  <text x="540" y="106" text-anchor="middle" font-size="10" fill="#78350f">Self-Attention</text>
  <text x="540" y="120" text-anchor="middle" font-size="10" fill="#78350f">Feed-Forward (×N)</text>

  <!-- Arrow 4 -->
  <line x1="610" y1="90" x2="638" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Décodage -->
  <rect x="640" y="60" width="100" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Décodage</text>
  <text x="690" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Softmax</text>
  <text x="690" y="142" text-anchor="middle" font-size="10" fill="#6b7280">Proba. par</text>
  <text x="690" y="155" text-anchor="middle" font-size="10" fill="#6b7280">token</text>

  <!-- Arrow 5 -->
  <line x1="740" y1="90" x2="768" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Texte de sortie -->
  <rect x="770" y="60" width="72" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="806" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Texte</text>
  <text x="806" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">généré</text>

  <!-- Footer note -->
  <text x="430" y="195" text-anchor="middle" font-size="10" fill="#9ca3af">Les couches Transformer sont répétées N fois (ex. GPT-4 : ~96 couches) — chaque couche affine la représentation contextuelle.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 314" width="420" height="314">
  <defs>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 'Not yet implemented' banner -->
  <rect x="0" y="0" width="420" height="28" rx="4" fill="#92400e"/>
  <rect x="0" y="20" width="420" height="8" fill="#92400e"/>
  <text x="18" y="19" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#fef3c7">⚠ À implémenter — GitIdentityDialog.java n'existe pas encore dans le code</text>

  <!-- Dialog background -->
  <rect x="0" y="28" width="420" height="286" rx="8" fill="#1a202c"/>

  <!-- Header background -->
  <rect x="0" y="28" width="420" height="42" rx="8" fill="#2d3748"/>
  <!-- square off bottom of header -->
  <rect x="0" y="62" width="420" height="8" fill="#2d3748"/>

  <!-- Title -->
  <text x="20" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Git Identity</text>

  <!-- Close button -->
  <rect x="386" y="39" width="22" height="20" rx="3" fill="#e53e3e"/>
  <text x="397" y="53" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">✕</text>

  <!-- Description -->
  <text x="20" y="94" font-family="Arial, sans-serif" font-size="11" fill="#718096">Configure the name and email used in commits for this repository.</text>

  <!-- Full name — label -->
  <text x="20" y="120" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">Full name</text>
  <!-- Full name — input -->
  <rect x="20" y="128" width="380" height="30" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="32" y="148" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Alice Dupont</text>

  <!-- Email — label -->
  <text x="20" y="178" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">Email address</text>
  <!-- Email — input -->
  <rect x="20" y="186" width="380" height="30" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="32" y="206" font-family="monospace" font-size="11" fill="#e2e8f0">alice@example.com</text>

  <!-- Checkbox — unchecked -->
  <rect x="20" y="234" width="16" height="16" rx="3" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <!-- Checkbox — label -->
  <text x="44" y="247" font-family="Arial, sans-serif" font-size="11" fill="#718096">Apply globally  (write to ~/.gitconfig)</text>

  <!-- Separator -->
  <line x1="0" y1="268" x2="420" y2="268" stroke="#2d3748" stroke-width="1"/>

  <!-- Footer background -->
  <rect x="0" y="276" width="420" height="38" rx="8" fill="#2d3748"/>
  <rect x="0" y="276" width="420" height="8" fill="#2d3748"/>

  <!-- Cancel button -->
  <rect x="228" y="286" width="84" height="24" rx="4" fill="#4a5568" stroke="#718096" stroke-width="1"/>
  <text x="270" y="303" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Cancel</text>

  <!-- OK button (primary) -->
  <rect x="322" y="286" width="78" height="24" rx="4" fill="url(#btnBlue)" filter="url(#shadow)"/>
  <text x="361" y="303" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">OK</text>
</svg>

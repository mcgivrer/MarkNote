<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <!-- Background -->
  <rect width="600" height="340" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="300" y="24" font-family="Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Front Matter Panel</text>

  <!-- Editor frame -->
  <rect x="20" y="40" width="560" height="285" rx="6" fill="#1e1e1e" stroke="#3d3d3d" stroke-width="1"/>

  <!-- Tab bar -->
  <rect x="20" y="40" width="560" height="28" rx="6" fill="#2d2d2d"/>
  <rect x="20" y="58" width="560" height="10" fill="#2d2d2d"/>
  <rect x="20" y="40" width="120" height="28" rx="6" fill="#1e1e1e"/>
  <rect x="20" y="58" width="120" height="10" fill="#1e1e1e"/>
  <text x="35" y="59" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">README.md</text>
  <text x="125" y="59" font-family="Arial, sans-serif" font-size="11" fill="#888888">×</text>

  <!-- Front Matter Panel (collapsible) -->
  <rect x="20" y="68" width="560" height="155" fill="#252525" stroke="#3d3d3d" stroke-width="0.5"/>

  <!-- Collapse toggle arrow -->
  <text x="30" y="86" font-family="Arial, sans-serif" font-size="12" fill="#61afef">▼</text>
  <text x="45" y="87" font-family="Arial, sans-serif" font-size="12" fill="#cccccc" font-weight="bold">Front Matter</text>

  <!-- Field grid -->
  <!-- Title -->
  <text x="30" y="110" font-family="Arial, sans-serif" font-size="10" fill="#888888">Title</text>
  <rect x="100" y="97" width="200" height="18" rx="3" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <text x="106" y="111" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Getting Started Guide</text>

  <!-- Tags -->
  <text x="30" y="133" font-family="Arial, sans-serif" font-size="10" fill="#888888">Tags</text>
  <rect x="100" y="120" width="200" height="18" rx="3" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <text x="106" y="134" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">java, tutorial, beginner</text>

  <!-- Authors -->
  <text x="30" y="156" font-family="Arial, sans-serif" font-size="10" fill="#888888">Authors</text>
  <rect x="100" y="143" width="200" height="18" rx="3" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <text x="106" y="157" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">John Doe</text>

  <!-- UUID -->
  <text x="320" y="110" font-family="Arial, sans-serif" font-size="10" fill="#888888">UUID</text>
  <rect x="380" y="97" width="190" height="18" rx="3" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <text x="386" y="111" font-family="monospace" font-size="8" fill="#98c379">550e8400-e29b-41d4...</text>

  <!-- Created At -->
  <text x="320" y="133" font-family="Arial, sans-serif" font-size="10" fill="#888888">Created</text>
  <rect x="380" y="120" width="120" height="18" rx="3" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <text x="386" y="134" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">2026-02-22</text>

  <!-- Draft checkbox -->
  <text x="320" y="156" font-family="Arial, sans-serif" font-size="10" fill="#888888">Draft</text>
  <rect x="380" y="144" width="14" height="14" rx="2" fill="#333333" stroke="#555555" stroke-width="0.5"/>

  <!-- Summary -->
  <text x="30" y="179" font-family="Arial, sans-serif" font-size="10" fill="#888888">Summary</text>
  <rect x="100" y="166" width="470" height="18" rx="3" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <text x="106" y="180" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">A step-by-step introduction to MarkNote features</text>

  <!-- Links section (collapsible) -->
  <text x="30" y="200" font-family="Arial, sans-serif" font-size="10" fill="#61afef">▶ Links</text>
  <rect x="85" y="192" width="24" height="14" rx="7" fill="#4a90d9"/>
  <text x="97" y="203" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2</text>

  <!-- Custom field (italic label) -->
  <text x="30" y="218" font-family="Arial, sans-serif" font-size="10" fill="#888888" font-style="italic">category</text>
  <rect x="100" y="205" width="200" height="18" rx="3" fill="#333333" stroke="#555555" stroke-width="0.5"/>
  <text x="106" y="219" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">documentation</text>

  <!-- Editor text area below -->
  <rect x="20" y="223" width="560" height="102" fill="#1e1e1e"/>
  <text x="35" y="250" font-family="monospace" font-size="12" fill="#c678dd"># Getting Started Guide</text>
  <text x="35" y="272" font-family="monospace" font-size="12" fill="#abb2bf">Welcome to the **MarkNote** editor.</text>
  <text x="35" y="294" font-family="monospace" font-size="12" fill="#abb2bf">This guide will help you...</text>

  <!-- Labels -->
  <rect x="420" y="72" width="120" height="18" rx="4" fill="#4a90d9" opacity="0.9"/>
  <text x="480" y="85" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Front Matter Panel</text>

  <rect x="420" y="295" width="80" height="18" rx="4" fill="#4a90d9" opacity="0.9"/>
  <text x="460" y="308" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Editor</text>
</svg>

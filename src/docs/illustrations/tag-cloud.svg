<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <!-- Light theme -->
  <rect width="800" height="520" fill="#e8edf3"/>

  <!-- Window frame -->
  <rect x="20" y="20" width="760" height="480" rx="8" fill="#ffffff" stroke="#c8cdd8" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="760" height="32" rx="8" fill="#f1f3f5"/>
  <rect x="20" y="44" width="760" height="8" fill="#f1f3f5"/>
  <line x1="20" y1="52" x2="780" y2="52" stroke="#dde1e8" stroke-width="1"/>
  <circle cx="44" cy="36" r="6" fill="#ef4444"/>
  <circle cx="66" cy="36" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="36" r="6" fill="#22c55e"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle">MarkNote — Tag Cloud</text>

  <!-- Left panel -->
  <rect x="20" y="52" width="200" height="448" fill="#f8fafc"/>
  <line x1="220" y1="52" x2="220" y2="500" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Project Explorer header -->
  <rect x="20" y="52" width="200" height="26" fill="#f1f5f9"/>
  <line x1="20" y1="78" x2="220" y2="78" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="70" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="600">Project Explorer</text>
  <text x="208" y="70" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af" text-anchor="end">×</text>

  <!-- Project tree -->
  <text x="35" y="100" font-family="monospace" font-size="11" fill="#d97706">📁 my-project</text>
  <text x="50" y="120" font-family="monospace" font-size="11" fill="#2563eb">📄 README.md</text>
  <text x="50" y="140" font-family="monospace" font-size="11" fill="#d97706">📁 docs</text>
  <text x="65" y="160" font-family="monospace" font-size="11" fill="#2563eb">📄 intro.md</text>
  <text x="65" y="180" font-family="monospace" font-size="11" fill="#2563eb">📄 guide.md</text>
  <text x="50" y="200" font-family="monospace" font-size="11" fill="#d97706">📁 blog</text>
  <text x="65" y="220" font-family="monospace" font-size="11" fill="#2563eb">📄 post-1.md</text>
  <text x="65" y="240" font-family="monospace" font-size="11" fill="#2563eb">📄 post-2.md</text>

  <!-- Tag Cloud Panel header -->
  <rect x="20" y="256" width="200" height="26" fill="#f1f5f9"/>
  <line x1="20" y1="282" x2="220" y2="282" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="274" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="600">Tag Cloud</text>
  <text x="208" y="274" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af" text-anchor="end">×</text>

  <!-- Tag Cloud content area -->
  <rect x="20" y="282" width="200" height="140" fill="#ffffff"/>
  <text x="30" y="312" font-family="Arial, sans-serif" font-size="24" fill="#2563eb" font-weight="bold">java</text>
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="14" fill="#16a34a">markdown</text>
  <text x="30" y="342" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b">css</text>
  <text x="62" y="340" font-family="Arial, sans-serif" font-size="20" fill="#7c3aed">tutorial</text>
  <text x="162" y="340" font-family="Arial, sans-serif" font-size="12" fill="#ef4444">api</text>
  <text x="30" y="370" font-family="Arial, sans-serif" font-size="18" fill="#0d9488">guide</text>
  <text x="108" y="372" font-family="Arial, sans-serif" font-size="14" fill="#d97706">javafx</text>
  <text x="172" y="308" font-family="Arial, sans-serif" font-size="16" fill="#ef4444">blog</text>
  <text x="30" y="400" font-family="Arial, sans-serif" font-size="12" fill="#16a34a">draft</text>
  <text x="82" y="402" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="bold">docs</text>
  <text x="152" y="400" font-family="Arial, sans-serif" font-size="13" fill="#7c3aed">setup</text>

  <!-- Network Diagram mini header -->
  <rect x="20" y="422" width="200" height="26" fill="#f1f5f9"/>
  <line x1="20" y1="448" x2="220" y2="448" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="440" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="600">Network Diagram</text>
  <text x="208" y="440" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af" text-anchor="end">×</text>
  <rect x="20" y="448" width="200" height="52" fill="#f8fafc"/>
  <!-- Mini graph -->
  <circle cx="62" cy="468" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="122" cy="462" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="92" cy="488" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="162" cy="482" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="62" y1="468" x2="122" y2="462" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="122" y1="462" x2="162" y2="482" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="62" y1="468" x2="92" y2="488" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Highlight callout for Tag Cloud panel -->
  <rect x="18" y="254" width="204" height="172" rx="4" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Right side: explanation -->
  <rect x="240" y="62" width="520" height="430" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="262" y="80" width="476" height="380" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>

  <text x="292" y="115" font-family="Arial, sans-serif" font-size="18" fill="#0c4a6e" font-weight="bold">Tag Cloud Panel</text>
  <line x1="292" y1="124" x2="714" y2="124" stroke="#bae6fd" stroke-width="1"/>

  <text x="292" y="152" font-family="Arial, sans-serif" font-size="13" fill="#334155">The Tag Cloud panel shows all tags found across your</text>
  <text x="292" y="170" font-family="Arial, sans-serif" font-size="13" fill="#334155">project’s Markdown front matter.</text>

  <text x="292" y="204" font-family="Arial, sans-serif" font-size="13" fill="#16a34a">Tag size</text>
  <text x="348" y="204" font-family="Arial, sans-serif" font-size="13" fill="#334155"> is proportional to frequency:</text>

  <!-- Size legend -->
  <text x="312" y="238" font-family="Arial, sans-serif" font-size="26" fill="#2563eb" font-weight="bold">large</text>
  <text x="410" y="238" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">= many documents</text>

  <text x="312" y="265" font-family="Arial, sans-serif" font-size="18" fill="#7c3aed">medium</text>
  <text x="410" y="265" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">= some documents</text>

  <text x="312" y="288" font-family="Arial, sans-serif" font-size="12" fill="#d97706">small</text>
  <text x="410" y="288" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">= few documents</text>

  <line x1="292" y1="303" x2="714" y2="303" stroke="#bae6fd" stroke-width="1"/>

  <text x="292" y="325" font-family="Arial, sans-serif" font-size="13" fill="#334155">Click a tag to search for documents with that tag.</text>
  <text x="292" y="348" font-family="Arial, sans-serif" font-size="13" fill="#334155">Tags are extracted from YAML front matter:</text>

  <rect x="312" y="360" width="200" height="72" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="324" y="380" font-family="monospace" font-size="12" fill="#9ca3af">---</text>
  <text x="324" y="397" font-family="monospace" font-size="12" fill="#ef4444">tags:</text>
  <text x="368" y="397" font-family="monospace" font-size="12" fill="#16a34a">java, tutorial, guide</text>
  <text x="324" y="414" font-family="monospace" font-size="12" fill="#9ca3af">---</text>

  <!-- Label pointer -->
  <rect x="282" y="452" width="100" height="24" rx="4" fill="#2563eb"/>
  <text x="332" y="468" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Tag Cloud</text>
  <line x1="282" y1="464" x2="222" y2="370" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>

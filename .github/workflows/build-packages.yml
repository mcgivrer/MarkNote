name: Build Native Packages

# ─── Triggers ──────────────────────────────────────────────────────────────
# • Automatic : every push of a version tag  (e.g. v0.1.5)
# • Manual    : "Run workflow" button in the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Allow the release job to create/update GitHub Releases
permissions:
  contents: write

# ─── Jobs ──────────────────────────────────────────────────────────────────
jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # Build a native installer on each target OS
  # ══════════════════════════════════════════════════════════════════════════
  package:
    name: Package – ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false         # let all three platforms build even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (DEB)
            artifact_name: installer-linux
            maven_extra_args: ""
          - os: macos-latest
            label: macOS Apple Silicon aarch64 (DMG)
            artifact_name: installer-macos-aarch64
            maven_extra_args: "-Djavafx.platform=mac-aarch64"
            # Note: no Intel (x86_64) runner is available on GitHub Actions free tier.
            # The aarch64 DMG runs natively on Apple Silicon and via Rosetta 2 on Intel.
          - os: windows-latest
            label: Windows (EXE)
            artifact_name: installer-windows
            maven_extra_args: ""

    steps:

      # ── 1. Checkout with full history ────────────────────────────────────
      #    git-commit-id-maven-plugin needs the full git log to resolve
      #    ${git.commit.id.abbrev} used in the fat-JAR name.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 24 (Azul Zulu) ────────────────────────────────────────────
      - name: Set up JDK 24 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'zulu'
          cache: maven          # cache ~/.m2 between runs

      # ── 3. Linux: ensure DEB packaging toolchain is present ──────────────
      #    jpackage --type deb requires fakeroot + dpkg (pre-installed on
      #    ubuntu-latest but explicit install guarantees availability).
      - name: Install DEB packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot

      # ── 4a. macOS: import Developer ID certificate into a temp keychain ──
      #    Secrets required (optional – unsigned DMG built if absent):
      #      MACOS_CERTIFICATE     base64-encoded .p12 (export from Keychain Access)
      #      MACOS_CERTIFICATE_PWD password chosen when exporting the .p12
      #    To encode locally: base64 -i Developer_ID.p12 | pbcopy
      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [[ -z "${MACOS_CERTIFICATE:-}" ]]; then
            echo "::notice::MACOS_CERTIFICATE not configured – DMG will be unsigned"
            exit 0
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign \
            -T "$(which jpackage 2>/dev/null || true)"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm /tmp/cert.p12

      # ── 4b. Build fat JAR + native installer ─────────────────────────────
      #    The active OS profile (linux / mac / win) is detected automatically
      #    by Maven via <os><family> activation in pom.xml.
      #    maven_extra_args overrides javafx.platform for the two macOS arches.
      #    --batch-mode suppresses interactive prompts and colourises output for CI.

      # macOS: jpackage --type dmg requires the first version digit to be >= 1.
      # Maven cannot override a <properties> entry via plugin execution, so we
      # compute a compatible version here and inject it via -Djpackage.app.version.
      # Example: 0.1.5 -> 1.1.3   (already-valid versions are left unchanged)
      - name: Compute jpackage-compatible version (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          raw=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --batch-mode)
          echo "JPACKAGE_APP_VERSION=$(echo "$raw" | sed 's/^0\./1./')" >> "$GITHUB_ENV"

      - name: Build and package
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          ARGS="${{ matrix.maven_extra_args }}"
          [[ -n "${JPACKAGE_APP_VERSION:-}" ]] && ARGS="$ARGS -Djpackage.app.version=$JPACKAGE_APP_VERSION"
          # Enable Developer ID signing on macOS when the secret is configured
          if [[ "$RUNNER_OS" == "macOS" ]] && [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            ARGS="$ARGS -Pmac-sign -Djpackage.mac.signing.key=${MACOS_SIGNING_IDENTITY}"
          fi
          mvn package -Ppackage $ARGS --batch-mode

      # ── 4c. macOS: notarise and staple the DMG ────────────────────────────
      #    Uses App Store Connect API key (no password needed).
      #    Secrets required (optional – skip if not configured):
      #      NOTARIZATION_KEY_CONTENT   base64-encoded .p8 API key
      #      NOTARIZATION_KEY_ID        10-char key ID  (ex: ABC123DEF4)
      #      NOTARIZATION_ISSUER_ID     UUID of the issuer shown in App Store Connect
      #    To encode locally: base64 -i AuthKey_XXXXXX.p8 | pbcopy
      - name: Notarize and staple DMG (macOS)
        if: runner.os == 'macOS'
        env:
          NOTARIZATION_KEY_CONTENT: ${{ secrets.NOTARIZATION_KEY_CONTENT }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: |
          if [[ -z "${NOTARIZATION_KEY_CONTENT:-}" ]]; then
            echo "::notice::NOTARIZATION_KEY_CONTENT not configured – skipping notarization"
            exit 0
          fi
          echo "$NOTARIZATION_KEY_CONTENT" | base64 --decode > /tmp/notarization.p8
          DMG=$(ls target/dist/*.dmg 2>/dev/null | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in target/dist/ – notarization skipped"
            rm /tmp/notarization.p8
            exit 1
          fi
          xcrun notarytool submit "$DMG" \
            --key /tmp/notarization.p8 \
            --key-id "$NOTARIZATION_KEY_ID" \
            --issuer-id "$NOTARIZATION_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          rm /tmp/notarization.p8

      # ── 4d. Always clean up the temp keychain ────────────────────────────
      - name: Clean up keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: security delete-keychain build.keychain 2>/dev/null || true

      # ── 5. Upload installer as workflow artifact ──────────────────────────
      #    Artifact is available in the Actions run page for 90 days.
      #    The release job below will also attach it to the GitHub Release.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/dist/
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════
  # Publish a GitHub Release with all three installers (tag pushes only)
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: Publish GitHub Release
    needs: package                               # wait for all three builds
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')    # skip on workflow_dispatch

    steps:

      # ── Download every installer artifact into dist/ ─────────────────────
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true    # flatten sub-dirs into dist/

      # ── Create (or update) the GitHub Release ────────────────────────────
      #    Attach DEB + DMG + EXE to the release.
      #    Release notes are auto-generated from merged PRs / commits.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true

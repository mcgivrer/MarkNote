<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <!-- Light theme -->
  <rect width="300" height="360" fill="#e8edf3"/>

  <!-- Project explorer panel -->
  <rect x="20" y="20" width="260" height="320" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="20" y="20" width="260" height="30" rx="6" fill="#f1f5f9"/>
  <rect x="20" y="40" width="260" height="10" fill="#f1f5f9"/>
  <line x1="20" y1="50" x2="280" y2="50" stroke="#e2e8f0" stroke-width="1"/>
  <text x="35" y="42" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="600">Project Explorer</text>
  <text x="264" y="42" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af">×</text>

  <!-- Toolbar -->
  <rect x="20" y="50" width="260" height="26" fill="#f8fafc"/>
  <line x1="20" y1="76" x2="280" y2="76" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Sync button -->
  <rect x="28" y="56" width="56" height="15" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="68" font-family="Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">⇅ Sync</text>
  <!-- Index button -->
  <rect x="90" y="56" width="56" height="15" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="118" y="68" font-family="Arial, sans-serif" font-size="9" fill="#374151" text-anchor="middle">↻ Index</text>

  <!-- Tree structure -->
  <g font-family="Consolas, monospace" font-size="12">
    <!-- Root folder -->
    <text x="35" y="101" fill="#d97706">📁 my-documentation</text>

    <!-- Level 1 items -->
    <!-- README.md with git staged dot -->
    <text x="50" y="126" fill="#2563eb">📄 README.md</text>
    <circle cx="268" cy="122" r="4" fill="#22c55e" title="staged"/>

    <!-- CHANGELOG with modified dot -->
    <text x="50" y="151" fill="#2563eb">📄 CHANGELOG.md</text>
    <circle cx="268" cy="147" r="4" fill="#f59e0b" title="modified"/>

    <!-- Subfolder -->
    <text x="50" y="176" fill="#d97706">📁 guides</text>
    <text x="65" y="201" fill="#2563eb">📄 getting-started.md</text>
    <text x="65" y="226" fill="#2563eb">📄 advanced.md</text>
    <!-- untracked dot -->
    <circle cx="268" cy="222" r="4" fill="#ef4444" title="untracked"/>

    <!-- Another subfolder -->
    <text x="50" y="251" fill="#d97706">📁 images</text>
    <text x="65" y="276" fill="#16a34a">🖼️ screenshot.png</text>
    <text x="65" y="301" fill="#16a34a">🖼️ logo.svg</text>
  </g>

  <!-- Git legend -->
  <line x1="20" y1="318" x2="280" y2="318" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="32" cy="330" r="4" fill="#22c55e"/>
  <text x="40" y="334" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">staged</text>
  <circle cx="88" cy="330" r="4" fill="#f59e0b"/>
  <text x="96" y="334" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">modified</text>
  <circle cx="156" cy="330" r="4" fill="#ef4444"/>
  <text x="164" y="334" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">untracked</text>
</svg>

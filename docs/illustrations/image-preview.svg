<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="500" height="330">
  <!-- Light theme -->
  <rect width="500" height="330" fill="#e8edf3"/>

  <!-- Title -->
  <text x="250" y="24" font-family="Arial, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Image Preview</text>

  <!-- Tab frame -->
  <rect x="20" y="40" width="460" height="275" rx="6" fill="#ffffff" stroke="#c8cdd8" stroke-width="1.5"/>

  <!-- Tab bar -->
  <rect x="20" y="40" width="460" height="28" rx="6" fill="#f1f3f5"/>
  <rect x="20" y="58" width="460" height="10" fill="#f1f3f5"/>
  <line x1="20" y1="68" x2="480" y2="68" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Active tab -->
  <rect x="24" y="42" width="126" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="36" y="58" font-family="Arial, sans-serif" font-size="10" fill="#1f2937">screenshot.png</text>
  <text x="132" y="58" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af">×</text>

  <!-- Info banner -->
  <rect x="20" y="68" width="460" height="24" fill="#f8fafc" stroke-bottom="none"/>
  <line x1="20" y1="92" x2="480" y2="92" stroke="#e5e7eb" stroke-width="1"/>
  <text x="250" y="84" font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">PNG  |  800 × 600 px</text>

  <!-- Image area (checkerboard-like bg for transparency) -->
  <rect x="20" y="92" width="460" height="223" fill="#f3f4f6"/>

  <!-- Simulated image content -->
  <rect x="100" y="108" width="300" height="182" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>

  <!-- Simulated image elements -->
  <rect x="120" y="122" width="120" height="20" rx="3" fill="#2563eb" opacity="0.8"/>
  <text x="180" y="137" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Header</text>

  <rect x="120" y="152" width="260" height="62" rx="3" fill="#f8fafc" stroke="#e5e7eb" stroke-width="0.5"/>
  <text x="148" y="172" font-family="monospace" font-size="10" fill="#16a34a">public class Main {</text>
  <text x="158" y="188" font-family="monospace" font-size="10" fill="#374151">  // content...</text>
  <text x="148" y="204" font-family="monospace" font-size="10" fill="#16a34a">}</text>

  <rect x="120" y="224" width="260" height="50" rx="3" fill="#f1f5f9"/>
  <text x="148" y="247" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Sample image content</text>
  <text x="148" y="263" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">with code and UI elements</text>

  <!-- Zoom overlay -->
  <rect x="205" y="178" width="90" height="34" rx="8" fill="#1f2937" opacity="0.75"/>
  <text x="250" y="201" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">150%</text>

  <!-- Labels -->
  <rect x="340" y="72" width="128" height="16" rx="4" fill="#2563eb"/>
  <text x="404" y="84" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Format &amp; Size Info</text>

  <rect x="308" y="185" width="100" height="16" rx="4" fill="#374151"/>
  <text x="358" y="197" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Zoom Overlay</text>
</svg>

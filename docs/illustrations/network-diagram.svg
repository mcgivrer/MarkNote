  <circle cx="44" cy="36" r="6" fill="#ef4444"/>
  <circle cx="66" cy="36" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="36" r="6" fill="#22c55e"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle">MarkNote — Network Diagram</text>


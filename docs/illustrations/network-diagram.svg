  <line x1="542" y1="140" x2="442" y2="182" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="462" y1="280" x2="442" y2="182" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="362" y1="160" x2="322" y2="260" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="462" y1="280" x2="322" y2="260" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="462" y1="280" x2="582" y2="222" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="660" y1="250" x2="582" y2="222" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>


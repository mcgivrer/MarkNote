  <circle cx="442" cy="182" r="12" fill="#2563eb"/>
  <text x="442" y="178" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">#</text>
  <text x="442" y="189" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">java</text>

  <circle cx="322" cy="260" r="12" fill="#7c3aed"/>
  <text x="322" y="256" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">#</text>
  <text x="322" y="267" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">tutorial</text>


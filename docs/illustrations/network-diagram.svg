  <text x="590" y="422" font-family="Arial, sans-serif" font-size="11" fill="#374151">Document link</text>

  <!-- Dashed line legend -->
  <line x1="540" y1="442" x2="580" y2="442" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="590" y="446" font-family="Arial, sans-serif" font-size="11" fill="#374151">Shared tag</text>


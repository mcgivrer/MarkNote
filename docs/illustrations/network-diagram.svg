  <text x="335" y="478" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Network Diagram</text>
  <line x1="270" y1="474" x2="222" y2="380" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>

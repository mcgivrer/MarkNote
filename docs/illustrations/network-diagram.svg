  <text x="660" y="246" font-family="Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">📄</text>
  <text x="660" y="260" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">setup.md</text>


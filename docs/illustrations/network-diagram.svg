  <circle cx="462" cy="280" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="462" y="276" font-family="Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">📄</text>
  <text x="462" y="290" font-family="Arial, sans-serif" font-size="7" fill="#374151" text-anchor="middle">api.md</text>


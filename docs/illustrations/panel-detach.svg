<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Light theme -->
  <rect width="800" height="400" fill="#e8edf3"/>

  <!-- === LEFT SIDE: Docked Panel === -->
  <rect x="20" y="55" width="180" height="290" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Panel header -->
  <rect x="20" y="55" width="180" height="28" rx="4" fill="#f1f5f9"/>
  <rect x="20" y="73" width="180" height="10" fill="#f1f5f9"/>
  <line x1="20" y1="83" x2="200" y2="83" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Panel title -->
  <text x="35" y="73" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="600">Tag Cloud</text>
  <!-- Close button -->
  <rect x="168" y="61" width="16" height="16" rx="2" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="173" y="73" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">×</text>
  <!-- Detach button (highlighted accent) -->
  <rect x="149" y="61" width="16" height="16" rx="2" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.5"/>
  <text x="153" y="73" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">↱</text>
  <!-- Highlight circle -->
  <circle cx="157" cy="69" r="13" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Tag cloud content -->
  <text x="40" y="115" font-family="Arial, sans-serif" font-size="14" fill="#0d9488">java</text>
  <text x="90" y="110" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">docs</text>
  <text x="35" y="140" font-family="Arial, sans-serif" font-size="16" fill="#ef4444">tutorial</text>
  <text x="120" y="135" font-family="Arial, sans-serif" font-size="11" fill="#8b5cf6">api</text>
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">guide</text>
  <text x="115" y="163" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">config</text>
  <text x="38" y="190" font-family="Arial, sans-serif" font-size="13" fill="#f59e0b">markdown</text>
  <!-- Label -->
  <text x="110" y="362" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="600">Docked Panel</text>
  <!-- Callout -->
  <line x1="157" y1="82" x2="157" y2="104" stroke="#f97316" stroke-width="2"/>
  <rect x="98" y="104" width="120" height="20" rx="3" fill="#f97316"/>
  <text x="158" y="118" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Detach Button ↱</text>

  <!-- === ARROW === -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>
  <line x1="222" y1="200" x2="318" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="270" y="192" font-family="Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">Click</text>

  <!-- === RIGHT SIDE: Detached as Tab === -->
  <rect x="338" y="36" width="442" height="324" rx="4" fill="#ffffff" stroke="#c8cdd8" stroke-width="1.5"/>
  <!-- Tab bar -->
  <rect x="338" y="36" width="442" height="30" rx="4" fill="#f1f3f5"/>
  <rect x="338" y="56" width="442" height="10" fill="#f1f3f5"/>
  <line x1="338" y1="66" x2="780" y2="66" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Document tab -->
  <rect x="343" y="40" width="105" height="22" rx="3" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="0.5"/>
  <text x="353" y="55" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">document.md</text>
  <text x="436" y="55" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">×</text>
  <!-- Active: Tag Cloud tab (highlighted) -->
  <rect x="452" y="38" width="98" height="24" rx="3" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.5"/>
  <text x="462" y="54" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Tag Cloud</text>
  <text x="534" y="54" font-family="Arial, sans-serif" font-size="10" fill="#bfdbfe">×</text>
  <!-- Highlight outline for new tab -->
  <rect x="449" y="36" width="104" height="28" rx="4" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Tab content area -->
  <rect x="338" y="66" width="442" height="294" fill="#fafafa" rx="2"/>
  <!-- Tag cloud in tab (larger, centered) -->
  <text x="430" y="120" font-family="Arial, sans-serif" font-size="20" fill="#0d9488">java</text>
  <text x="530" y="114" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">docs</text>
  <text x="380" y="162" font-family="Arial, sans-serif" font-size="24" fill="#ef4444">tutorial</text>
  <text x="556" y="152" font-family="Arial, sans-serif" font-size="15" fill="#8b5cf6">api</text>
  <text x="456" y="200" font-family="Arial, sans-serif" font-size="16" fill="#2563eb">guide</text>
  <text x="580" y="192" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">config</text>
  <text x="405" y="238" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b">markdown</text>
  <text x="545" y="234" font-family="Arial, sans-serif" font-size="14" fill="#60a5fa">project</text>
  <text x="630" y="228" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">index</text>
  <text x="358" y="278" font-family="Arial, sans-serif" font-size="20" fill="#f472b6">features</text>
  <text x="526" y="272" font-family="Arial, sans-serif" font-size="15" fill="#0d9488">help</text>
  <!-- Tip box -->
  <rect x="618" y="78" width="154" height="52" rx="4" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="628" y="96" font-family="Arial, sans-serif" font-size="9" fill="#78350f">Use the ↲ button or</text>
  <text x="628" y="110" font-family="Arial, sans-serif" font-size="9" fill="#78350f">View menu to</text>
  <text x="628" y="124" font-family="Arial, sans-serif" font-size="9" fill="#78350f" font-weight="600">restore the panel</text>
  <!-- Label -->
  <text x="559" y="380" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="600">Detached as Tab</text>
  <!-- Callout -->
  <line x1="501" y1="36" x2="501" y2="16" stroke="#f97316" stroke-width="2"/>
  <rect x="432" y="2" width="138" height="18" rx="3" fill="#f97316"/>
  <text x="501" y="14" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Panel becomes a Tab</text>
</svg>
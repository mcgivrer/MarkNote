<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <!-- Light theme -->
  <rect width="800" height="240" fill="#e8edf3"/>

  <!-- Window frame (bottom portion) -->
  <rect x="20" y="20" width="760" height="200" rx="8" fill="#ffffff" stroke="#c8cdd8" stroke-width="1.5"/>

  <!-- Editor area (dimmed) -->
  <rect x="22" y="22" width="756" height="140" fill="#fafafa" rx="6"/>
  <text x="40" y="58" font-family="monospace" font-size="12" fill="#c0c0c0" opacity="0.8"># My Document</text>
  <text x="40" y="80" font-family="monospace" font-size="12" fill="#d0d0d0" opacity="0.8">Some **Markdown** content here.</text>
  <text x="40" y="100" font-family="monospace" font-size="12" fill="#d0d0d0" opacity="0.8">With *multiple* lines of text.</text>
  <text x="40" y="120" font-family="monospace" font-size="12" fill="#d0d0d0" opacity="0.8">- List item one</text>

  <!-- Status bar -->
  <rect x="22" y="162" width="756" height="26" fill="#f3f4f6"/>
  <line x1="22" y1="162" x2="778" y2="162" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="22" y1="188" x2="778" y2="188" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Section 1: Document name + position -->
  <text x="34" y="179" font-family="Arial, sans-serif" font-size="11" fill="#374151">README.md</text>
  <text x="116" y="179" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Ln 42, Col 15</text>
  <line x1="215" y1="165" x2="215" y2="185" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Section 2: Statistics -->
  <text x="225" y="179" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Docs: 24  │  Lines: 128  │  Words: 847</text>
  <line x1="468" y1="165" x2="468" y2="185" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Section 3: PlantUML indicator -->
  <text x="478" y="179" font-family="Arial, sans-serif" font-size="10" fill="#374151">⛯ PlantUML: local jar</text>
  <line x1="610" y1="165" x2="610" y2="185" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Section 4: Indexing progress -->
  <text x="620" y="179" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Indexing…</text>
  <!-- Progress bar -->
  <rect x="683" y="168" width="88" height="10" rx="3" fill="#e5e7eb" stroke="#d1d5db" stroke-width="0.5"/>
  <rect x="684" y="169" width="62" height="8" rx="3" fill="#2563eb"/>

  <!-- Highlight border -->
  <rect x="20" y="160" width="760" height="30" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Labels -->
  <rect x="30" y="198" width="155" height="20" rx="4" fill="#2563eb"/>
  <text x="107" y="212" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">Document &amp; Position</text>
  <line x1="107" y1="198" x2="100" y2="188" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>

  <rect x="240" y="198" width="80" height="20" rx="4" fill="#2563eb"/>
  <text x="280" y="212" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">Statistics</text>
  <line x1="280" y1="198" x2="340" y2="188" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>

  <rect x="420" y="198" width="155" height="20" rx="4" fill="#374151"/>
  <text x="497" y="212" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">⛯ PlantUML local jar</text>
  <line x1="497" y1="198" x2="520" y2="188" stroke="#374151" stroke-width="1.5" stroke-dasharray="3,2"/>

  <rect x="600" y="198" width="130" height="20" rx="4" fill="#2563eb"/>
  <text x="665" y="212" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">Indexing Progress</text>
  <line x1="665" y1="198" x2="690" y2="188" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>

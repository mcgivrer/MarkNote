<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" width="760" height="422">
  <defs>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="760" height="422" fill="#e8edf3"/>

  <!-- ── Mode label — left (Token) ── -->
  <rect x="10" y="4" width="360" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="190" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">HTTPS + Token authentication</text>

  <!-- ── Mode label — right (SSH) ── -->
  <rect x="390" y="4" width="360" height="24" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="570" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">SSH key authentication</text>


  <!-- ════════════════════════════════════════════════
       LEFT DIALOG — HTTPS / Token
       x=10, y=36, width=360, height=382
       ════════════════════════════════════════════════ -->

  <!-- Dialog background -->
  <rect x="10" y="36" width="360" height="382" rx="8" fill="#1a202c"/>

  <!-- Header background -->
  <rect x="10" y="36" width="360" height="42" rx="8" fill="#2d3748"/>
  <rect x="10" y="68" width="360" height="10" fill="#2d3748"/>

  <!-- Title -->
  <text x="30" y="63" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Add Remote</text>
  <!-- Close -->
  <rect x="342" y="46" width="20" height="18" rx="3" fill="#e53e3e"/>
  <text x="352" y="59" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">✕</text>

  <!-- Remote URL — label -->
  <text x="30" y="98" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">Remote URL</text>
  <!-- Remote URL — input -->
  <rect x="30" y="106" width="320" height="30" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="42" y="126" font-family="monospace" font-size="10" fill="#e2e8f0">https://github.com/alice/my-docs.git</text>

  <!-- Authentication — label -->
  <text x="30" y="156" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">Authentication</text>
  <!-- ComboBox — main field -->
  <rect x="30" y="164" width="282" height="26" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="42" y="182" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">Token</text>
  <!-- ComboBox — arrow button -->
  <rect x="314" y="164" width="36" height="26" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <text x="332" y="182" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">▼</text>

  <!-- Username — label -->
  <text x="30" y="212" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">Username</text>
  <!-- Username — input -->
  <rect x="30" y="220" width="320" height="30" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="42" y="240" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">alice</text>

  <!-- Token — label -->
  <text x="30" y="270" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">Token</text>
  <!-- Token — input (masked) -->
  <rect x="30" y="278" width="291" height="30" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="42" y="298" font-family="monospace" font-size="11" fill="#718096">••••••••••••••••••••••••</text>
  <!-- Eye button -->
  <rect x="325" y="278" width="25" height="30" rx="3" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <text x="337" y="298" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">👁</text>

  <!-- Test Connection button -->
  <rect x="85" y="328" width="180" height="26" rx="4" fill="url(#btnGreen)" filter="url(#shadow)"/>
  <text x="175" y="346" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Test Connection</text>

  <!-- Footer background -->
  <rect x="10" y="376" width="360" height="42" rx="8" fill="#2d3748"/>
  <rect x="10" y="376" width="360" height="10" fill="#2d3748"/>
  <!-- Cancel -->
  <rect x="180" y="388" width="84" height="24" rx="4" fill="#4a5568" stroke="#718096" stroke-width="1"/>
  <text x="222" y="405" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Cancel</text>
  <!-- Save (primary) -->
  <rect x="274" y="388" width="78" height="24" rx="4" fill="url(#btnBlue)" filter="url(#shadow)"/>
  <text x="313" y="405" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Save</text>


  <!-- ════════════════════════════════════════════════
       RIGHT DIALOG — SSH key
       x=390, y=36, width=360, height=382
       ════════════════════════════════════════════════ -->

  <!-- Dialog background -->
  <rect x="390" y="36" width="360" height="382" rx="8" fill="#1a202c"/>

  <!-- Header background -->
  <rect x="390" y="36" width="360" height="42" rx="8" fill="#2d3748"/>
  <rect x="390" y="68" width="360" height="10" fill="#2d3748"/>

  <!-- Title -->
  <text x="410" y="63" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Add Remote</text>
  <!-- Close -->
  <rect x="722" y="46" width="20" height="18" rx="3" fill="#e53e3e"/>
  <text x="732" y="59" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">✕</text>

  <!-- Remote URL — label -->
  <text x="410" y="98" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">Remote URL</text>
  <!-- Remote URL — input -->
  <rect x="410" y="106" width="320" height="30" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="422" y="126" font-family="monospace" font-size="10" fill="#e2e8f0">git@github.com:alice/my-docs.git</text>

  <!-- Authentication — label -->
  <text x="410" y="156" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">Authentication</text>
  <!-- ComboBox — main field -->
  <rect x="410" y="164" width="282" height="26" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="422" y="182" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">SSH key</text>
  <!-- ComboBox — arrow button -->
  <rect x="694" y="164" width="36" height="26" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <text x="712" y="182" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">▼</text>

  <!-- SSH private key path — label -->
  <text x="410" y="212" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">SSH private key path</text>
  <!-- SSH key path — input -->
  <rect x="410" y="220" width="290" height="30" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="422" y="240" font-family="monospace" font-size="10" fill="#e2e8f0">/home/alice/.ssh/id_ed25519</text>
  <!-- Browse button -->
  <rect x="704" y="220" width="26" height="30" rx="3" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <text x="717" y="240" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">📂</text>

  <!-- SSH passphrase — label + optional note -->
  <text x="410" y="270" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0">SSH passphrase</text>
  <text x="510" y="270" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#4a5568"> (optional)</text>
  <!-- SSH passphrase — input (masked) -->
  <rect x="410" y="278" width="291" height="30" rx="4" fill="#171923" stroke="#4a5568" stroke-width="1"/>
  <text x="422" y="298" font-family="monospace" font-size="11" fill="#718096">••••••••</text>
  <!-- Eye button -->
  <rect x="705" y="278" width="25" height="30" rx="3" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <text x="717" y="298" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">👁</text>

  <!-- Test Connection button -->
  <rect x="465" y="328" width="180" height="26" rx="4" fill="url(#btnGreen)" filter="url(#shadow)"/>
  <text x="555" y="346" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Test Connection</text>

  <!-- Footer background -->
  <rect x="390" y="376" width="360" height="42" rx="8" fill="#2d3748"/>
  <rect x="390" y="376" width="360" height="10" fill="#2d3748"/>
  <!-- Cancel -->
  <rect x="560" y="388" width="84" height="24" rx="4" fill="#4a5568" stroke="#718096" stroke-width="1"/>
  <text x="602" y="405" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Cancel</text>
  <!-- Save (primary) -->
  <rect x="654" y="388" width="78" height="24" rx="4" fill="url(#btnBlue)" filter="url(#shadow)"/>
  <text x="693" y="405" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Save</text>
</svg>
